<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimonSaysGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="board-badge">Memory Challenge</div>
      <h1>Simon Says Game</h1>
      <div class="score-panel">
        <h3>Highest Score</h3>
      </div>
      <h2>Press any key to start</h2>

      <div class="btn-container" aria-label="Simon game buttons">
        <div class="line-one">
          <div class="btn red" type="button" id="red" aria-label="Red button">
            1
          </div>
          <div
            class="btn yellow"
            type="button"
            id="yellow"
            aria-label="Yellow button"
          >
            2
          </div>
        </div>
        <div class="line-two">
          <div
            class="btn green"
            type="button"
            id="green"
            aria-label="Green button"
          >
            3
          </div>
          <div
            class="btn purple"
            type="button"
            id="purple"
            aria-label="Purple button"
          >
            4
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
